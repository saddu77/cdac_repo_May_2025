<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function getValues(){
        let marks = new Array(99,88,77,44,67,78);
        for(var i = 0; i < marks.length; i++){
            document.writeln(marks[i] + '<br />');
        }
    }
</script>
<body>
    <h2>Arrays Demo in JS</h2>
    <input type="submit" onclick="getValues()" value="get Values" />
</body>
</html>
