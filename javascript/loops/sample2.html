<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function display(){
        var i = 1;
        while(i <= 10){
            document.writeln(i + "<br />");
            i++;
        }
    }
</script>
<body>
    <h2>While Loop Demo</h2>
    <input type="submit" onclick="display()" value="Get Values"/>
    
</body>
</html>
