<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function display(){
         for(var i = 1; i <= 10 ; i++){
            document.writeln(i + "<br />");
         }
    }
</script>
<body>
    <h2>Loops Demo</h2>
    <input type="submit" onclick="display()" value="Get Values"/>
</body>
</html>
