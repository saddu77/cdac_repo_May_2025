<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
   class Person{
        constructor(name){
            this.name = name;
        }    

        toString(){
            return "My Name  is: " + this.name;
        }
   }

   class Student extends Person{
        constructor(name,id){
            super(name);
            this.id = id;
        }

        toString(){
            return super.toString()+ " Student id is: " + this.id;
        }
   }

   let s1 = new Student("Mehul", 22);
   console.log(s1.toString());
   
</script>
<body>
    <h2>Inheritance Demo</h2>
</body>
</html>
