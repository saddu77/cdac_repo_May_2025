<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script>
    function getInfo(){
        var name = "John";
        console.log("Name is : " + name);        
        console.log("Length is: " + name.length);
        console.log(`Name is" ${name}`);
                
    }
</script>
<body>
    <h2> Strings Demo </h2>
    <input type="submit" onclick="getInfo()" value="get Values"/>
</body>
