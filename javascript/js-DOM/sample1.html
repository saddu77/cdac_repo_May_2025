<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JS DOM</h2>
    <p id="p1">This is a sample JavaScript</p>
    <p>This is a DOM Demo in JS</p>
    <p id="demo"></p>
    <input type="submit" onclick="display()" value="Display"/>
</body>
<script>
    function display(){
        const ele = document.getElementById("p1");
        document.getElementById("demo").innerHTML = "New Text in a Para " + ele.innerHTML;
    }
    
</script>
</html>
