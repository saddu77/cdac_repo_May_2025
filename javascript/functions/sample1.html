<head>

<script>
    function greet(name){
        console.log("Hello " + name);
        
    }

    let displayPI = function(){
        console.log("PI = 3.14");
        
    }

    function findSquare(num){
        return num * num;
    }

    greet("Alex")
    displayPI()

    let squre = findSquare(3)
    console.log("Square :" + squre);

    let squareRoot = Math.sqrt(4);
    console.log("Square root is: "+ squareRoot);

    let power = Math.pow(2,3);
    console.log("Power res :" + power);

    let band = "Iron Maiden";
    let bandUpper = band.toUpperCase();
    console.log("Band is: " + bandUpper);
    
    
    
    
</script>
<body>
    <h2>JS Functions Demo</h2>
