<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 30%;
        text-align: center;
        margin: auto;
    }
    td,th{
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
    }
    tr:nth-child(odd){
        background-color: #dddddd;
    }
</style>
<body>
    <h2>HTML5 Table Demo</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Alex</td>
            <td>alex@gmail.com</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Bob</td>
            <td>bob@gmail.com</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Clare</td>
            <td>clare@gmail.com</td>
        </tr>
        <tr>
            <td>104</td>
            <td>Daniel</td>
            <td>daniel@gmail.com</td>
        </tr>
        <tr>
            <td>105</td>
            <td>John</td>
            <td>john@gmail.com</td>
        </tr>
    </table>
</body>
</html>
